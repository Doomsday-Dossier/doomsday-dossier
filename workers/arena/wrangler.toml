name = "doomsday-arena"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://prejith77.github.io,http://localhost:4322,http://localhost:4321"

# created with `wrangler d1 create doomsday-arena` (26 October 2026)
[[d1_databases]]
binding = "DB"
database_name = "doomsday-arena"
database_id = "f645a0eb-1ae7-4421-ba60-47ab0f150150"

# Secrets (never in this file):
#   wrangler secret put TURNSTILE_SECRET   (from the Turnstile widget)
